name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: update-ai-news-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            echo "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      - name: Update data
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.opml
          else
            python scripts/update_news.py --output-dir data --window-hours 24
          fi

      - name: Build watchlist boards
        run: |
          python scripts/build_watchlists.py --env-file .env

      - name: Commit and push changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tracked_files=(
            data/latest-24h.json
            data/archive.json
            data/source-status.json
            data/waytoagi-7d.json
            data/title-zh-cache.json
            data/special-focus.json
            data/competitor-monitor.json
          )

          if git diff --quiet -- "${tracked_files[@]}"; then
            echo "No tracked data changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add "${tracked_files[@]}"

          if git diff --cached --quiet; then
            echo "No staged data changes to commit"
            exit 0
          fi

          git commit -m "chore: update ai news snapshot"

          for attempt in 1 2 3; do
            if git push --verbose origin main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi

            echo "Push failed on attempt ${attempt}; fetching latest main and retrying"
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      - name: Deploy to Vercel (optional)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping Vercel deploy: required secrets are missing"
            exit 0
          fi
          npx --yes vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel --prod --yes --token "$VERCEL_TOKEN"
